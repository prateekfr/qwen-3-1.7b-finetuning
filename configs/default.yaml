# Default Training Configuration — Qwen, Minus the E
# All hyperparameters in one place for easy tuning.

# === Model ===
model:
  name: "Qwen/Qwen3-1.7B"
  quantization: "nf4"            # 4-bit NF4 via bitsandbytes
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  trust_remote_code: true

# === LoRA ===
lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

# === Forbidden Letter Mask ===
mask:
  forbidden_chars: ["e", "E"]
  include_accented: true         # Also block é, è, ê, ë, É, È, Ê, Ë, etc.

# === SFT Training ===
sft:
  epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 4  # Effective batch = 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_seq_length: 512
  gradient_checkpointing: true
  save_best_only: true           # Save only the best checkpoint (by val loss)
  eval_every_epoch: true
  fp16: false
  bf16: true

# === Reward Strategy (RL / GRPO) ===
reward:
  # TOGGLE: "local" or "api"
  # - "local": 100% offline composite reward (lipogram constraint + length shaping + n-gram repetition + lexicon validity + topical overlap). Free, deterministic, zero latency.
  # - "api": Remote LLM-as-a-judge (OpenAI / OpenRouter style endpoint). Requires API key in .env.
  mode: "local"

  # API-as-a-Judge Configuration (OpenRouter / OpenAI / Groq / vLLM / Ollama)
  api:
    base_url: "https://openrouter.ai/api/v1"        # e.g. "https://openrouter.ai/api/v1" or "https://api.openai.com/v1"
    model: "openai/gpt-4o-mini"                    # Model identifier
    api_key_env: "OPENROUTER_API_KEY"              # Looked up in .env or OS environment (also checks OPENAI_API_KEY)
    combine: "sum"                                 # "sum" (average of coherence + responds) or "lowest" (min)
    temperature: 0.0
    max_retries: 3
    timeout: 30.0
    fallback_to_local_on_failure: true             # Automatically fallback to local reward if API is offline/out of quota

  # Local Composite Reward Configuration (Offline Heuristics)
  local:
    dictionary_path: "data/dictionary/english_words.txt"
    min_length_tokens: 15                          # Penalize short lazy answers
    target_min_tokens: 25                          # Ideal minimum length
    target_max_tokens: 80                          # Ideal maximum length
    max_penalty_tokens: 140                        # Penalize rambling
    weights:
      repetition: 0.40                             # Distinct 2-gram and 3-gram score
      dictionary: 0.35                             # Fraction of real English dictionary words
      relevance: 0.25                              # Keyword overlap with user prompt

# === RL / GRPO Training ===
rl:
  total_steps: 300
  prompts_per_step: 4
  answers_per_prompt: 4          # Candidate rollout group size G=4 optimized for 4GB VRAM
  learning_rate: 2.0e-5
  kl_penalty: 0.02
  temperature: 0.7
  max_gen_length: 200            # Tuned for fast generation and VRAM efficiency
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

# === Generation ===
generation:
  max_new_tokens: 200
  temperature: 0.7
  top_p: 0.9
  do_sample: true

# === Paths ===
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  checkpoints: "checkpoints"
  logs: "logs"

# === Hardware ===
hardware:
  device: "cuda"
  low_cpu_mem_usage: true
  empty_cache_between_steps: true  # Call torch.cuda.empty_cache() between RL steps
